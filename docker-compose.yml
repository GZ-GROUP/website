# Local development services. Next.js runs natively (`npm run dev`).
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gz_user
      POSTGRES_PASSWORD: gz_password
      POSTGRES_DB: gz_group_dev
    ports:
      - "5432:5432"
    volumes:
      - gz_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gz_user -d gz_group_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  # S3-compatible object storage for uploaded images (ADR 0008).
  # S3 API on :9000, web console on :9001. The bucket is created by the app.
  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-gz_dev_access}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-gz_dev_secret_change_me}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: /data
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gz_rustfs_data:/data

volumes:
  gz_postgres_data:
  gz_rustfs_data:
